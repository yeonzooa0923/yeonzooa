<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>주아 업보시트</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="header-banner" id="headerBanner">
  <div class="header-inner">
    <div class="header-title-group">
      <div class="header-avatar" id="headerAvatar">💚</div>
      <div class="header-title">
        <h1>주아 업보시트</h1>
        <p id="statsLine">불러오는 중...</p>
      </div>
    </div>
    <a href="admin.html" class="admin-link">관리자</a>
  </div>
</div>

<div class="wrap">

  <div class="section" id="section-roulette">
    <div class="section-head"><h2>🎰 룰렛 확률표</h2></div>
    <div class="card" id="rouletteCard"></div>
  </div>

  <div class="section" id="section-upbo">
    <div class="section-head"><h2>💚 내 업보 확인</h2></div>

    <div class="search-row">
      <input class="search-input" id="searchInput" placeholder="닉네임으로 찾기" />
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="list">업보 목록</button>
      <button class="tab-btn" data-tab="records">획득 기록</button>
      <button class="tab-btn" data-tab="heart">하트 조각 교환</button>
    </div>

    <div class="tab-panel active" id="tab-list">
      <div class="card">
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>닉네임</th><th>업보</th><th>건수</th></tr></thead>
            <tbody id="listTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="tab-records">
      <div class="card">
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>닉네임</th><th>룰렛</th><th>획득 상품</th><th>일시</th></tr></thead>
            <tbody id="recordsTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="tab-heart">
      <div class="card">
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>교환 아이템</th><th>필요 조각</th></tr></thead>
            <tbody id="heartTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="section" id="section-notice">
    <div class="section-head"><h2>📌 공지사항</h2></div>
    <div class="card" id="noticeCard"></div>
  </div>

  <div class="footer-note" id="footerNote">데이터는 실시간으로 반영됩니다 · 문의는 주아에게!</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
</body>
</html>
